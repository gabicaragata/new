# Minimal stack for trying Portainer GitOps on the home server.
# Change MESSAGE, commit and push: Portainer redeploys and the page shows the new text.
services:
  web:
    image: docker.io/library/nginx:1.27-alpine
    network_mode: host   # rootful Podman: forwarded ports are dropped by ufw, host ports are not
    environment:
      MESSAGE: "Salut din GitOps - versiunea 1"
      PORT: "8088"
    command:
      - sh
      - -c
      - |
        sed -i "s/listen  *80;/listen $${PORT};/; s/listen  *\[::\]:80;/listen [::]:$${PORT};/" /etc/nginx/conf.d/default.conf
        printf '<!doctype html><meta charset="utf-8"><title>gitops-demo</title><h1>%s</h1><p>%s</p>\n' "$${MESSAGE}" "$$(date -u)" > /usr/share/nginx/html/index.html
        exec nginx -g 'daemon off;'
    restart: unless-stopped
